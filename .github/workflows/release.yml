name: Release FancyDrops

# Only runs when you press "Run workflow" on the Actions tab. Pick the branch to release from (main = the Main build).
# The release text is the matching section of CHANGELOG.md, so write the notes there first.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match gradle.properties and a '## <version>' section in CHANGELOG.md)"
        required: true
        type: string
      prerelease:
        description: "Mark as a pre-release (beta)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check the version
        shell: bash
        run: |
          set -euo pipefail
          FILE_VERSION=$(grep -E '^version=' gradle.properties | head -n 1 | cut -d '=' -f 2- | tr -d '\r')
          if [ "$FILE_VERSION" != "${{ inputs.version }}" ]; then
            echo "::error::gradle.properties says $FILE_VERSION but you asked to release ${{ inputs.version }}"
            exit 1
          fi

      - name: Write the release notes from CHANGELOG.md
        shell: bash
        run: |
          set -euo pipefail
          awk -v v="${{ inputs.version }}" '
            $0 ~ "^## " v "[[:space:]]*$" { on = 1; next }
            /^## / && on { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No '## ${{ inputs.version }}' section with text in CHANGELOG.md"
            exit 1
          fi
          cat release-notes.md

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Collect the files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          jar_file=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -print -quit)
          [ -n "$jar_file" ] || { echo "::error::No production JAR found in build/libs"; exit 1; }
          cp "$jar_file" release/FancyDrops.jar
          if [ -f resourcepack/FancyDrops-Animated-Suffix.zip ]; then cp resourcepack/FancyDrops-Animated-Suffix.zip release/; fi
          ls -lh release

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}-${{ github.ref_name }}
          name: FancyDrops ${{ inputs.version }} [${{ github.ref_name == 'main' && 'Full' || 'Beta' }}]
          body_path: release-notes.md
          prerelease: ${{ inputs.prerelease || github.ref_name != 'main' }}
          make_latest: ${{ github.ref_name == 'main' && !inputs.prerelease }}
          files: |
            release/FancyDrops.jar
            release/FancyDrops-Animated-Suffix.zip
          fail_on_unmatched_files: false

name: Build FancyDrops

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build mod
        run: ./gradlew build

      - name: Find production JAR
        shell: bash
        run: |
          set -euo pipefail
          echo "JAR files produced by Gradle:"
          find build/libs -maxdepth 1 -type f -name '*.jar' -print

          mkdir -p release

          jar_file=$(find build/libs -maxdepth 1 -type f \
            -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-dev.jar' \
            -print -quit)

          if [ -z "$jar_file" ]; then
            echo "::error::No production JAR found in build/libs"
            exit 1
          fi

          cp "$jar_file" release/FancyDrops.jar
          echo "Prepared release/FancyDrops.jar"
          ls -lh release/FancyDrops.jar

      - name: Publish direct JAR download
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.ref_name }}-${{ github.run_number }}
          name: FancyDrops ${{ github.ref_name }} Build ${{ github.run_number }}
          body: Automated FancyDrops build from branch ${{ github.ref_name }}.
          prerelease: true
          make_latest: false
          files: release/FancyDrops.jar
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}

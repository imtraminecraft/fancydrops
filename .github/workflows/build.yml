
name: Build FancyDrops

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build mod
        run: ./gradlew build

      - name: Prepare mod download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          jar_file=$(find build/libs -maxdepth 1 -type f \
            -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-dev.jar' \
            -print -quit)

          if [ -z "$jar_file" ]; then
            echo "No production mod JAR found!"
            exit 1
          fi

          cp "$jar_file" "release/FancyDrops-${GITHUB_REF_NAME}-${GITHUB_RUN_NUMBER}.jar"

      - name: Publish direct JAR download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.ref_name }}-${{ github.run_number }}
          name: FancyDrops ${{ github.ref_name }} Build ${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: release/*.jar
          generate_release_notes: true
